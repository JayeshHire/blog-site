<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form action="./signup" method="POST">
        <input type="text" placeholder="Full Name" id="full_name" name="full_name"><br>
        <input type="text" placeholder="username" id="username" name="username"><br>
        <input type="email" placeholder="Email" id="email" name="email"><br>
        <input type="password" placeholder="password" id="password" name="password"><br>
        <input type="password" placeholder="confirm password" id="confirm-password" name="confirm-password"><br>
        <input type="submit" value="Register">
    </form>

    <form action="./signin" method="POST">
        <input type="text" placeholder="Enter username or email" id="username_or_email" name="username_or_email"><br>
        <input type="password" placeholder="Enter password" id="password" name="password"><br>
        <input type="submit" value="signin">
    </form>
</body>
</html>
